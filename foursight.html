<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FourSight.AI — See the problem. Shape reality.</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#0a0d1a;--p:#11162a;--b:#ffffff1a;--v:#8b5cf6;--c:#22d3ee;--m:#9ca3af}
*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;background:var(--bg);color:#e5e7eb;font:14px Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}

.logo{display:flex;gap:10px;align-items:center;margin-bottom:18px;font-weight:600;font-size:16px}.logo small{display:block;font-weight:400;font-size:10px;color:#6b7280}
.nav{display:flex;gap:10px;align-items:center;padding:9px 11px;border-radius:8px;border:0;background:0;color:var(--m);cursor:pointer;text-align:left;transition:.15s}
.nav:hover{background:#ffffff0d;color:#fff}.nav.on{background:#8b5cf626;color:#fff;box-shadow:inset 2px 0 var(--v)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;gap:10px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--b);position:relative;z-index:1200}
header input{flex:1;max-width:420px;margin:0 auto}
.btn{background:linear-gradient(90deg,#7c3aed,#8b5cf6);border:0;border-radius:8px;padding:8px 14px;color:#fff;cursor:pointer;font-weight:500;box-shadow:0 4px 18px #5b21b655;transition:.15s;white-space:nowrap}.btn:hover{filter:brightness(1.15)}.btn:disabled{opacity:.5;cursor:default}
.ghost{background:0;border:1px solid var(--b);border-radius:8px;padding:8px 12px;cursor:pointer}.ghost:hover{background:#ffffff0d}
input,select,textarea{background:#0c1020;border:1px solid var(--b);border-radius:8px;padding:8px 10px;outline:0;width:100%}input:focus,select:focus,textarea:focus{border-color:var(--v)}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--v),var(--c));color:#000;font-weight:700;display:grid;place-items:center;font-size:12px}
#content{flex:1;overflow-y:auto;padding:22px}

.card{background:var(--p);border:1px solid var(--b);border-radius:12px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.metrics .card{padding:14px}.metrics b{font-size:30px;display:block;margin-top:4px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar select{width:auto}
.split{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.mapw{position:relative;border:1px solid var(--b);border-radius:12px;overflow:hidden;box-shadow:0 10px 50px #4c1d9540}#map,#pm,#dm{height:100%;width:100%;background:#0f1424}
.dark .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.5)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#151a2e;color:#e5e7eb}
.legend,.cnt{position:absolute;z-index:500;background:#0a0d1ae6;border:1px solid var(--b);border-radius:8px;font-size:11px;padding:6px 9px}.legend{left:10px;bottom:10px}.cnt{right:10px;top:10px;color:var(--c);border-radius:99px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.feed{display:flex;flex-direction:column;min-height:0}.ft{padding:12px;border-bottom:1px solid var(--b);font-weight:500}#feed{overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px}
.item{background:#0e1326;border:1px solid var(--b);border-radius:9px;padding:10px;cursor:pointer;transition:.15s;animation:f .25s}.item:hover{border-color:#8b5cf699;background:#131933}
@keyframes f{from{opacity:0;transform:translateY(6px)}}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.g{flex-wrap:wrap;align-items:center;margin-top:7px;justify-content:flex-start}.ml{margin-left:auto}
code{color:var(--c)}.tag{background:#ffffff0d;border-radius:4px;padding:0 5px}
.bd{border-radius:99px;padding:2px 8px;font-size:11px;font-weight:500}.s0{background:#64748b33;color:#cbd5e1}.s1{background:#22d3ee22;color:#67e8f9}.s2{background:#8b5cf633;color:#c4b5fd}.s3{background:#3b82f633;color:#93c5fd}.s4{background:#22c55e26;color:#86efac}
table{width:100%;border-collapse:collapse;min-width:700px}th{text-align:left;color:var(--m);font-weight:500;font-size:12px}td,th{padding:11px}tr.r{border-top:1px solid #ffffff0d;cursor:pointer}tr.r:hover{background:#ffffff08}
.form{display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:1000px;margin:auto}.form label{display:block;margin:12px 0 4px;color:var(--m);font-size:12px}.err{color:#f87171;font-size:12px;min-height:14px}
.chips{display:flex;gap:6px}.chips button{flex:1;padding:8px;background:0;border:1px solid var(--b);border-radius:8px;cursor:pointer}
.bars .card{padding:16px}.br{margin:9px 0;font-size:12px;color:var(--m)}.br div{height:8px;background:#ffffff0d;border-radius:4px;margin-top:3px}.br i{display:block;height:8px;border-radius:4px;transition:width .5s}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
#drawer{position:fixed;inset:0;z-index:2000;background:#000a;display:none;justify-content:flex-end}#drawer>div{width:min(480px,100%);height:100%;overflow-y:auto;background:#0d1122;border-left:1px solid var(--b);padding:20px;animation:f .25s}
.tl{border-left:1px solid #8b5cf666;margin:10px 0 0 6px;padding-left:16px}.tl div{position:relative;margin-bottom:12px}.tl div:before{content:"";position:absolute;left:-21px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--v)}
#bell{position:absolute;right:130px;top:52px;width:290px;display:none;padding:8px}#bell div{padding:8px;border-radius:8px;cursor:pointer}#bell div:hover{background:#ffffff0d}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#151a2e;border:1px solid #8b5cf666;border-radius:8px;padding:9px 16px;z-index:3000;display:none}
.center{max-width:420px;margin:70px auto;text-align:center}.tk{font:700 40px monospace;color:var(--c);margin:10px 0}
.sw{width:44px;height:24px;border-radius:99px;background:#ffffff26;border:0;position:relative;cursor:pointer}.sw:after{content:"";position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--v)}.sw.on:after{left:22px}
#menu{display:none;background:0;border:0;font-size:22px;cursor:pointer}
@media(max-width:900px){.side{position:fixed;z-index:1600;height:100%;left:-240px}.side.open{left:0}#menu{display:block}.split,.form,.two{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.split{height:auto!important}.mapw{height:420px}.feed{max-height:480px}#colb{display:none}header h2{display:none}}
</style></head><body>
<aside class="side" id="side"></aside>
<div class="main"><header><button id="menu" onclick="side.classList.toggle('open')">☰</button><h2 id="ttl" style="margin:0;font-size:15px"></h2>
<input id="gs" placeholder="Search reports, streets, ticket IDs…" oninput="S.q=this.value;if(S.page!='overview'&&S.page!='explore')go('explore');else upd()">
<button class="ghost" onclick="bell.style.display=bell.style.display=='block'?'none':'block';renderBell()">🔔</button><button class="btn" onclick="go('report')">+ Report Issue</button><div class="avatar" title="Demo user">DU</div></header>
<div id="bell" class="card"></div><div id="content"></div></div>
<div id="drawer" onclick="if(event.target==this)closeI()"><div id="dc"></div></div><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const ST=['Submitted','Under Review','Acknowledged','In Progress','Resolved'],PR=['Low','Medium','High','Urgent'],CA=['Pothole','Streetlight','Trash','Sidewalk','Graffiti','Drainage'];
const COL={Low:'#38bdf8',Medium:'#f59e0b',High:'#f97316',Urgent:'#ef4444'},C0=[42.3223,-83.1763],D=864e5;
const rows=[['Deep pothole near intersection','Pothole','High',1,42.3146,-83.2012,'Michigan Ave & Telegraph Rd',14,6],['Streetlight out for a week','Streetlight','Medium',2,42.3301,-83.1752,'Monroe St near Mason',8,9],['Overflowing public trash bin','Trash','Low',0,42.3228,-83.1801,'Downtown Dearborn plaza',3,1],['Cracked sidewalk, trip hazard','Sidewalk','High',3,42.3189,-83.1693,'Warren Ave near Schaefer',11,12],['Blocked storm drain after rain','Drainage','Urgent',3,42.3352,-83.1884,'Outer Dr & Ford Rd',21,4],['Graffiti on underpass wall','Graffiti','Low',4,42.3265,-83.1587,'Greenfield Rd underpass',5,20],['Sunken pothole cluster','Pothole','Urgent',1,42.3098,-83.1745,'Dix Hwy & Rotunda',17,3],['Flickering streetlight','Streetlight','Low',0,42.3374,-83.1651,'Park St, north block',2,2],['Illegal dumping behind lot','Trash','Medium',2,42.3171,-83.1912,'Villa Ave alley',9,7],['Broken curb ramp','Sidewalk','High',1,42.3243,-83.2054,'Military St crossing',12,10],['Standing water in gutter','Drainage','Medium',4,42.3205,-83.1626,'Garrison St',6,25],['Faded graffiti tag on fence','Graffiti','Low',4,42.3317,-83.1948,'Oakwood Blvd',1,30],['Pothole on bus route','Pothole','Medium',2,42.3124,-83.1856,'Schaefer Hwy shoulder',10,8],['Dark crosswalk, bulb failed','Streetlight','Urgent',3,42.3288,-83.1722,'Ford Rd crosswalk',19,5],['Bin lid missing at bus stop','Trash','Low',0,42.3158,-83.1634,'Ford Rd bus stop',4,0]];
const seed=()=>rows.map((r,i)=>{const t0=Date.now()-r[8]*D-3e6,k=r[3];const h=ST.slice(0,k+1).map((status,j)=>({status,at:new Date(t0+j*(r[8]*D-3e6)/(k||1)/1.5).toISOString()}));
 return{id:'demo-'+i,ticketId:'FS-'+(10200+i*17),title:r[0],description:r[0]+'. Fictional demonstration report for the FourSight.AI prototype — not a verified report about a real location.',category:r[1],priority:r[2],status:ST[k],location:r[6],latitude:r[4],longitude:r[5],createdAt:new Date(t0).toISOString(),updatedAt:h[k].at,reportedBy:'Demo Neighbor',confirmations:r[7],statusHistory:h,isDemo:true}});
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
let issues=ld('fs_issues',null)||seed(),conf=ld('fs_conf',[]),dark=ld('fs_dark',true);
const S={page:'overview',q:'',f:{cat:'',pri:'',st:'',sort:'new'},col:false,sel:null,done:null,pin:null,photo:null};
const $=s=>document.querySelector(s),save=()=>{try{localStorage.fs_issues=JSON.stringify(issues);localStorage.fs_conf=JSON.stringify(conf);localStorage.fs_dark=JSON.stringify(dark)}catch(e){toast('Storage full — photo may be too large')}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}),fmtT=d=>new Date(d).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
const pri=p=>`<span class="bd" style="background:${COL[p]}22;color:${COL[p]}">${p}</span>`,st=s=>`<span class="bd s${ST.indexOf(s)}">${s}</span>`,opts=a=>a.map(o=>`<option>${o}</option>`).join('');
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}
const LOGO=`<svg width="32" height="32" viewBox="0 0 32 32"><defs><linearGradient id="g"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><g fill="none" stroke="url(#g)" stroke-width="1.6">${[0,90,180,270].map(r=>`<ellipse cx="16" cy="7" rx="3.2" ry="5" transform="rotate(${r} 16 16)"/>`).join('')}</g><circle cx="16" cy="16" r="2.2" fill="#a78bfa" style="filter:drop-shadow(0 0 4px #8b5cf6)"/></svg>`;
const NAV=[['overview','◈','Overview'],['explore','◎','Explore Map'],['report','＋','Report an Issue'],['tickets','▤','My Tickets'],['impact','▥','Community Impact'],['settings','⚙','Settings']];
function renderSide(){side.className='side'+(S.col?' col':'');side.innerHTML=`<div class="logo">${LOGO}<div class="lb">FourSight<span style="color:#a78bfa">.AI</span><small>See the problem. Shape reality.</small></div></div>`+NAV.map(n=>`<button class="nav ${S.page==n[0]?'on':''}" onclick="go('${n[0]}')" title="${n[2]}"><span>${n[1]}</span><span class="lb">${n[2]}</span></button>`).join('')+`<div style="margin-top:auto"><button class="nav" id="colb" onclick="S.col=!S.col;renderSide()"><span>${S.col?'»':'«'}</span><span class="lb">Collapse</span></button><div class="mu lb" style="padding:6px 11px">by <b style="color:#c4b5fd">4 Eyes Mage</b></div></div>`}
let map,layer;
function filt(l=issues){const q=S.q.toLowerCase(),f=S.f;return l.filter(i=>(!f.cat||i.category==f.cat)&&(!f.pri||i.priority==f.pri)&&(!f.st||i.status==f.st)&&(!q||(i.title+i.location+i.ticketId+i.category).toLowerCase().includes(q))).sort((a,b)=>f.sort=='conf'?b.confirmations-a.confirmations:f.sort=='pri'?PR.indexOf(b.priority)-PR.indexOf(a.priority):new Date(b.createdAt)-new Date(a.createdAt))}
const tiles=()=>L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:19});
const card=i=>`<div class="item" onclick="openI('${i.id}')"><div class="row"><b>${esc(i.title)}</b>${pri(i.priority)}</div><div class="mu">📍 ${esc(i.location)}</div><div class="row g mu">${st(i.status)}<span>${i.category}</span><span>${fmt(i.createdAt)}</span><code>${i.ticketId}</code><span class="ml">👍 ${i.confirmations}</span><span class="tag">${i.isDemo?'Demo':'Yours'}</span></div></div>`;
function upd(){const l=filt();$('#fc').value=S.f.cat;$('#fp').value=S.f.pri;$('#fs').value=S.f.st;$('#so').value=S.f.sort;$('#gs').value=S.q;
 $('#feed').innerHTML=l.length?l.map(card).join(''):'<p class="mu" style="text-align:center;padding:30px">No issues match these filters.</p>';$('#cnt').textContent=l.length+' issues shown';layer.clearLayers();
 l.forEach(i=>L.circleMarker([i.latitude,i.longitude],{radius:i.isDemo?9:12,color:i.isDemo?'#0a0d1a':'#fff',weight:2,fillColor:COL[i.priority],fillOpacity:.9}).bindPopup(`<b>${esc(i.title)}</b><br><span class="mu">${i.ticketId} · ${i.category}</span><br>${pri(i.priority)} ${st(i.status)}<br><a href="#" style="color:#a78bfa" onclick="openI('${i.id}');return false">Open details →</a>`).addTo(layer))}
const ws=h=>`<div class="bar"><select id="fc" onchange="S.f.cat=this.value;upd()"><option value="">All categories</option>${opts(CA)}</select><select id="fp" onchange="S.f.pri=this.value;upd()"><option value="">All priorities</option>${opts(PR)}</select><select id="fs" onchange="S.f.st=this.value;upd()"><option value="">All statuses</option>${opts(ST)}</select><select id="so" onchange="S.f.sort=this.value;upd()"><option value="new">Newest</option><option value="conf">Most confirmed</option><option value="pri">Highest priority</option></select><button class="ghost" onclick="S.q='';S.f={cat:'',pri:'',st:'',sort:'new'};upd()">Reset filters</button></div>
<div class="split" style="height:${h}"><div class="mapw"><div id="map" class="${dark?'dark':''}"></div><div class="legend">${PR.map(p=>`<div><i style="background:${COL[p]}"></i>${p}</div>`).join('')}<div class="mu">White ring = your report</div></div><div class="cnt" id="cnt"></div></div><div class="card feed"><div class="ft">Community feed</div><div id="feed"></div></div></div>`;
function initWs(){if(map)map.remove();map=L.map('map').setView(C0,13);tiles().addTo(map);layer=L.layerGroup().addTo(map);upd()}
function go(p){S.page=p;S.done=null;S.pin=null;S.photo=null;closeI();side.classList.remove('open');bell.style.display='none';render()}
function render(){renderSide();$('#ttl').textContent=NAV.find(n=>n[0]==S.page)[2];const c=$('#content');if(map){map.remove();map=null}
 if(S.page=='overview'){const n=s=>issues.filter(i=>i.status==s).length,m=[['Total Issues',issues.length],['Open Issues',issues.length-n('In Progress')-n('Resolved')],['In Progress',n('In Progress')],['Resolved',n('Resolved')]];
  c.innerHTML=`<h1>Your community, in focus.</h1><p class="mu" style="font-size:14px;margin:4px 0">See what's happening around you and help turn reports into action.</p><div class="metrics">${m.map(x=>`<div class="card"><span class="mu">${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>${ws('560px')}<p class="mu">Seeded issues are fictional demo data, not verified reports.</p>`;initWs()}
 else if(S.page=='explore'){c.innerHTML=ws('calc(100vh - 170px)');initWs()}
 else if(S.page=='report')reportPage(c);else if(S.page=='tickets')tickets(c);else if(S.page=='impact')impact(c);else settings(c)}
function reportPage(c){const d=S.done;if(d){c.innerHTML=`<div class="center"><div style="font-size:52px;color:#4ade80">✔</div><h2>Report created</h2><div class="tk">${d.ticketId}</div><p class="mu">Saved in this browser only. This is a frontend demo — nothing was sent to any city government.</p><button class="btn" onclick="openI('${d.id}')">View issue</button> <button class="ghost" onclick="go('overview')">Back to dashboard</button></div>`;return}
 c.innerHTML=`<div class="form"><div><h1 style="font-size:26px">Conjure a report</h1><p class="mu">Name the problem, pin it, and get a ticket you can follow.</p>
 <label>Issue title</label><input id="t" placeholder="e.g. Deep pothole in the right lane"><div class="err" id="e1"></div>
 <div style="display:grid;grid-template-columns:1fr 1.4fr;gap:10px"><div><label>Category</label><select id="c">${opts(CA)}</select></div><div><label>Priority</label><div class="chips" id="pc">${PR.map(p=>`<button type="button" data-p="${p}" onclick="pickP('${p}')">${p}</button>`).join('')}</div></div></div>
 <label>Description</label><textarea id="d" rows="4" placeholder="What's wrong, how big is it, who is affected?"></textarea><div class="err" id="e2"></div>
 <label>Location</label><input id="l" placeholder="Street, cross street or landmark"><div class="err" id="e3"></div>
 <label>Photo (optional)</label><input type="file" accept="image/*" onchange="photo(this)"><img id="pv" style="max-height:130px;border-radius:8px;margin-top:8px;display:none">
 <button class="btn" id="sb" style="width:100%;margin-top:14px" onclick="submitR()">Submit report</button></div>
 <div><label>Pin the location — click the map</label><div class="mapw" style="height:520px"><div id="pm" class="${dark?'dark':''}"></div></div><div class="mu" id="pt">No pin yet.</div><div class="err" id="e4"></div></div></div>`;
 pickP('Medium');map=L.map('pm').setView(C0,13);tiles().addTo(map);let mk;map.on('click',e=>{S.pin=[+e.latlng.lat.toFixed(5),+e.latlng.lng.toFixed(5)];mk&&mk.remove();mk=L.circleMarker(S.pin,{radius:11,color:'#fff',fillColor:'#8b5cf6',fillOpacity:1}).addTo(map);$('#pt').textContent='Pin: '+S.pin.join(', ');if(!$('#l').value)$('#l').value='Pinned at '+S.pin.join(', ')})}
let PP='Medium';function pickP(p){PP=p;document.querySelectorAll('#pc button').forEach(b=>{const on=b.dataset.p==p;b.style.borderColor=on?COL[p]:'';b.style.background=on?COL[p]+'25':'';b.style.color=on?COL[p]:''})}
function photo(el){const f=el.files[0];if(!f)return;if(f.size>1.5e6){toast('Image must be under 1.5 MB');el.value='';return}const r=new FileReader();r.onload=()=>{S.photo=r.result;$('#pv').src=r.result;$('#pv').style.display='block'};r.readAsDataURL(f)}
function submitR(){const t=$('#t').value.trim(),d=$('#d').value.trim(),l=$('#l').value.trim();$('#e1').textContent=t.length<5?'Enter a title of at least 5 characters.':'';$('#e2').textContent=d.length<15?'Describe the problem in at least 15 characters.':'';$('#e3').textContent=l?'':'Add a street or landmark.';$('#e4').textContent=S.pin?'':'Click the map to drop a pin.';
 if(t.length<5||d.length<15||!l||!S.pin)return;$('#sb').disabled=true;$('#sb').textContent='Creating ticket…';
 setTimeout(()=>{let tk;do tk='FS-'+(10000+Math.floor(Math.random()*90000));while(issues.some(i=>i.ticketId==tk));const now=new Date().toISOString();
  const i={id:'u-'+Date.now(),ticketId:tk,title:t,description:d,category:$('#c').value,priority:PP,status:'Submitted',location:l,latitude:S.pin[0],longitude:S.pin[1],createdAt:now,updatedAt:now,reportedBy:'You (Demo User)',photo:S.photo||undefined,confirmations:1,statusHistory:[{status:'Submitted',at:now}],isDemo:false};
  issues.unshift(i);conf.push(i.id);save();S.done=i;render()},700)}
function openI(id){const i=issues.find(x=>x.id==id);if(!i)return;S.sel=id;const k=ST.indexOf(i.status),ok=conf.includes(id);bell.style.display='none';
 $('#dc').innerHTML=`<div class="row"><div><code>${i.ticketId}</code><h2 style="margin:2px 0">${esc(i.title)}</h2></div><button class="ghost" onclick="closeI()">✕</button></div><div class="row g">${st(i.status)}${pri(i.priority)}<span class="tag">${i.category}</span>${i.isDemo?'<span class="tag">Demo data</span>':''}</div><p>${esc(i.description)}</p>${i.photo?`<img src="${i.photo}" style="width:100%;max-height:220px;object-fit:cover;border-radius:8px">`:''}<p class="mu">📍 ${esc(i.location)}<br>Submitted ${fmt(i.createdAt)} · Updated ${fmt(i.updatedAt)} · by ${esc(i.reportedBy)}</p>
 <div class="mapw" style="height:160px"><div id="dm" class="${dark?'dark':''}"></div></div><button class="btn" style="width:100%;margin:12px 0" ${ok?'disabled':''} onclick="confirmI('${id}')">👍 ${ok?'Confirmed':'Confirm this issue'} · ${i.confirmations}</button>
 <b>Status history</b><div class="tl">${i.statusHistory.map(h=>`<div>${h.status}<br><span class="mu">${fmtT(h.at)}</span></div>`).join('')}</div>${k<4?`<button class="ghost" style="width:100%" onclick="adv('${id}')">Demo: advance to “${ST[k+1]}”</button>`:'<p style="text-align:center;color:#4ade80">Resolved ✓</p>'}`;
 $('#drawer').style.display='flex';const m=L.map('dm',{dragging:false,zoomControl:false,scrollWheelZoom:false}).setView([i.latitude,i.longitude],15);tiles().addTo(m);L.circleMarker([i.latitude,i.longitude],{radius:10,color:'#fff',fillColor:COL[i.priority],fillOpacity:1}).addTo(m)}
function closeI(){S.sel=null;$('#drawer').style.display='none'}
function refresh(){save();const id=S.sel;if(S.page!='report')render();if(id)openI(id)}
function confirmI(id){if(conf.includes(id))return;conf.push(id);issues.find(i=>i.id==id).confirmations++;toast('Thanks — your confirmation was recorded.');refresh()}
function adv(id){const i=issues.find(x=>x.id==id),k=ST.indexOf(i.status);if(k>=4)return;i.status=ST[k+1];i.updatedAt=new Date().toISOString();i.statusHistory.push({status:i.status,at:i.updatedAt});toast('Status → '+i.status);refresh()}
function tickets(c){const mine=issues.filter(i=>!i.isDemo);if(!mine.length){c.innerHTML=`<div class="center"><div style="font-size:44px">🎫</div><h2>No tickets yet</h2><p class="mu">Reports you submit appear here. Seeded community reports stay on the map and feed.</p><button class="btn" onclick="go('report')">Report Your First Issue</button></div>`;return}
 const l=filt(mine);c.innerHTML=`<div class="bar"><select id="fs" onchange="S.f.st=this.value;go2()"><option value="">All statuses</option>${opts(ST)}</select><select id="fp" onchange="S.f.pri=this.value;go2()"><option value="">All priorities</option>${opts(PR)}</select></div><div class="card" style="overflow-x:auto"><table><tr>${['Ticket','Title','Category','Priority','Status','Submitted','Updated'].map(h=>`<th>${h}</th>`).join('')}</tr>${l.map(i=>`<tr class="r" onclick="openI('${i.id}')"><td><code>${i.ticketId}</code></td><td>${esc(i.title)}</td><td>${i.category}</td><td>${pri(i.priority)}</td><td>${st(i.status)}</td><td class="mu">${fmt(i.createdAt)}</td><td class="mu">${fmt(i.updatedAt)}</td></tr>`).join('')}</table>${l.length?'':'<p class="mu" style="text-align:center">No tickets match.</p>'}</div><p class="mu">Search uses the box in the top bar.</p>`;$('#fs').value=S.f.st;$('#fp').value=S.f.pri}
const go2=()=>{const x=S.sel;render()};
function bars(t,d,col){const mx=Math.max(1,...d.map(x=>x[1]));return`<div class="card"><b>${t}</b>${d.map(x=>`<div class="br"><div style="display:flex;justify-content:space-between;background:0;height:auto"><span>${x[0]}</span><span>${x[1]}</span></div><div><i style="width:${x[1]/mx*100}%;background:${col(x[0])}"></i></div></div>`).join('')}</div>`}
function impact(c){const r=issues.filter(i=>i.status=='Resolved').length,n=issues.length,days=[...Array(7)].map((_,k)=>{const t=new Date(Date.now()-(6-k)*D);return[t.toLocaleDateString('en-US',{weekday:'short'}),issues.filter(i=>new Date(i.createdAt).toDateString()==t.toDateString()).length]});
 c.innerHTML=`<p class="mu" style="color:#fcd34d">Demo statistics computed from prototype data — not real municipal performance.</p><div class="metrics">${[['Total reports',n],['Resolved',r],['Resolution rate',Math.round(r/Math.max(1,n)*100)+'%'],['Open',n-r]].map(x=>`<div class="card"><span class="mu">${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><div class="two bars">${bars('Open vs resolved',[['Open',n-r],['Resolved',r]],k=>k=='Open'?'#f97316':'#22c55e')}${bars('By status',ST.map(s=>[s,issues.filter(i=>i.status==s).length]),()=>'#8b5cf6')}${bars('By category',CA.map(s=>[s,issues.filter(i=>i.category==s).length]),()=>'#22d3ee')}${bars('By priority',PR.map(s=>[s,issues.filter(i=>i.priority==s).length]),k=>COL[k])}${bars('Reports submitted, last 7 days',days,()=>'#a78bfa')}</div>`}
function settings(c){c.innerHTML=`<div style="max-width:640px;margin:auto;display:grid;gap:14px"><div class="card row" style="padding:16px;align-items:center"><div><b>Dark map tiles</b><div class="mu">Midnight theme for OpenStreetMap tiles.</div></div><button class="sw ${dark?'on':''}" onclick="dark=!dark;save();render()"></button></div><div class="card" style="padding:16px"><div class="logo" style="margin:0 0 6px">${LOGO}About FourSight.AI</div><p class="mu" style="font-size:13px">See the problem. Shape reality. Four eyes working together to bring overlooked neighborhood problems into focus. A frontend-only prototype by <b style="color:#c4b5fd">4 Eyes Mage</b> for “Conjure Reality”. Data lives in your browser's LocalStorage — no backend, no AI.</p></div><div class="card row" style="padding:16px;align-items:center"><div><b>Reset demo data</b><div class="mu">Restores seeded issues and removes your reports.</div></div><button class="ghost" style="color:#f87171;border-color:#ef444488" onclick="if(confirm('Reset all demo data? Your reports and confirmations will be deleted.')){issues=seed();conf=[];save();toast('Demo data reset.');render()}">Reset…</button></div></div>`}
function renderBell(){bell.innerHTML='<div class="mu">Recent activity (demo)</div>'+[...issues].sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt)).slice(0,5).map(i=>`<div onclick="openI('${i.id}')">${esc(i.title)}<br><span class="mu">${i.ticketId} → ${i.status} · ${fmt(i.updatedAt)}</span></div>`).join('')}
render();
</script></body></html>
